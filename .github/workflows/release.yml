name: Qualify and publish release

on:
  workflow_run:
    workflows:
      - Request release
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: afmkit-release
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify trusted default-branch commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ${{ vars.AFMKIT_XCODE27_RUNNER || 'xcode-27' }}
    outputs:
      qualified_sha: ${{ github.event.workflow_run.head_sha }}
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Download exact release request
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-request-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/release-request
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate request provenance and tag
        id: request
        env:
          REQUEST_PATH: ${{ runner.temp }}/release-request/request.json
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          with open(os.environ["REQUEST_PATH"], encoding="utf-8") as handle:
              request = json.load(handle)
          expected = {"run_id": int(os.environ["EXPECTED_RUN_ID"]), "sha": os.environ["EXPECTED_SHA"]}
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"Release request {key} does not match triggering workflow.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={request.get('tag', '')}\n")
          PY
          Scripts/validate-release-tag.sh "$(python3 -c 'import json,os; print(json.load(open(os.environ["REQUEST_PATH"]))["tag"])')"
      - name: Reject stale or conflicting candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG_NAME: ${{ steps.request.outputs.tag }}
        with:
          script: |
            const publication = require(process.env.GITHUB_WORKSPACE + "/Scripts/release-publication.js");
            await publication.assertReleaseCandidate({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              tagName: process.env.TAG_NAME,
              qualifiedSha: process.env.QUALIFIED_SHA,
              defaultBranch: context.payload.repository.default_branch,
            });
      - name: Run full single-repository release qualification
        env:
          AFMKIT_BUILD_ROOT: ${{ runner.temp }}/afmkit-release-${{ github.event.workflow_run.head_sha }}
          AFMKIT_DOWNSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          AFMKIT_DOWNSTREAM_TAG: ${{ steps.request.outputs.tag }}
        run: Scripts/validate-release.sh

  publish:
    name: Publish qualified AFMKit tag
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.qualify.outputs.qualified_sha }}
          persist-credentials: false
      - name: Record immutable publication intent
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          QUALIFIED_SHA: ${{ needs.qualify.outputs.qualified_sha }}
          TAG_NAME: ${{ needs.qualify.outputs.tag }}
        with:
          script: |
            const publication = require(process.env.GITHUB_WORKSPACE + "/Scripts/release-publication.js");
            await publication.ensurePublicationIntent({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              tagName: process.env.TAG_NAME,
              qualifiedSha: process.env.QUALIFIED_SHA,
              defaultBranch: context.payload.repository.default_branch,
            });
      - name: Publish root tag and GitHub release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          QUALIFIED_SHA: ${{ needs.qualify.outputs.qualified_sha }}
          TAG_NAME: ${{ needs.qualify.outputs.tag }}
        with:
          script: |
            const publication = require(process.env.GITHUB_WORKSPACE + "/Scripts/release-publication.js");
            const result = await publication.publishRelease({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              tagName: process.env.TAG_NAME,
              qualifiedSha: process.env.QUALIFIED_SHA,
              defaultBranch: context.payload.repository.default_branch,
            });
            core.info(JSON.stringify(result));
