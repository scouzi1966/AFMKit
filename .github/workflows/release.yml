name: Qualify and publish release

on:
  workflow_run:
    workflows:
      - Request release
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: afmkit-release
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify trusted default-branch commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on:
      group: afmkit-privileged-release
      labels: afmkit-privileged-xcode27-ephemeral
    outputs:
      qualified_sha: ${{ github.event.workflow_run.head_sha }}
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Download exact release request
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-request-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/release-request
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate request provenance and tag
        id: request
        env:
          REQUEST_PATH: ${{ runner.temp }}/release-request/request.json
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["REQUEST_PATH"], encoding="utf-8") as handle:
              request = json.load(handle)
          expected = {
              "run_id": int(os.environ["EXPECTED_RUN_ID"]),
              "sha": os.environ["EXPECTED_SHA"],
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"Release request {key} does not match triggering workflow.")
          tag = request.get("tag", "")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
          PY
          Scripts/validate-release-tag.sh "$(python3 -c 'import json,os; print(json.load(open(os.environ["REQUEST_PATH"]))["tag"])')"
      - name: Reject stale or conflicting candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          QUALIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG_NAME: ${{ steps.request.outputs.tag }}
        with:
          script: |
            const publication = require(process.env.GITHUB_WORKSPACE + "/Scripts/release-publication.js");
            await publication.assertReleaseCandidate({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              tagName: process.env.TAG_NAME,
              qualifiedSha: process.env.QUALIFIED_SHA,
              defaultBranch: context.payload.repository.default_branch,
            });
      - name: Run full release qualification
        env:
          AFMKIT_BUILD_ROOT: ${{ runner.temp }}/afmkit-release-${{ github.event.workflow_run.head_sha }}
          AFMKIT_DEPENDENCY_TOKEN: ${{ secrets.AFMKIT_DEPENDENCY_TOKEN }}
          AFMKIT_DOWNSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          AFMKIT_DOWNSTREAM_TAG: ${{ steps.request.outputs.tag }}
          AFMKIT_PUBLIC_RELEASE_URL: https://github.com/${{ github.repository }}.git
          AFMKIT_RELEASE_MIRROR_OUTPUT: ${{ runner.temp }}/provider-mirrors
        run: Scripts/with-private-dependency-auth.sh Scripts/validate-release.sh
      - name: Upload exact qualified provider mirrors
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provider-mirrors-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/provider-mirrors
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish qualified package set
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.qualify.outputs.qualified_sha }}
          persist-credentials: false
      - name: Download exact qualified provider mirrors
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: provider-mirrors-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/provider-mirrors
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Record immutable publication intent
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          QUALIFIED_SHA: ${{ needs.qualify.outputs.qualified_sha }}
          TAG_NAME: ${{ needs.qualify.outputs.tag }}
        with:
          script: |
            const publication = require(process.env.GITHUB_WORKSPACE + "/Scripts/release-publication.js");
            const result = await publication.ensurePublicationIntent({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              tagName: process.env.TAG_NAME,
              qualifiedSha: process.env.QUALIFIED_SHA,
              defaultBranch: context.payload.repository.default_branch,
            });
            core.info(JSON.stringify(result));
      - name: Publish provider package tags idempotently
        env:
          AFMKIT_PROVIDER_PUBLISH_TOKEN: ${{ secrets.AFMKIT_PROVIDER_PUBLISH_TOKEN }}
          AFMKIT_PUBLIC_RELEASE_URL: https://github.com/${{ github.repository }}.git
          AFMKIT_DWARFSTAR_PUBLISH_URL: ${{ vars.AFMKIT_DWARFSTAR_PUBLISH_URL || format('https://github.com/{0}/AFMKitDwarfStar.git', github.repository_owner) }}
          AFMKIT_MLX_PUBLISH_URL: ${{ vars.AFMKIT_MLX_PUBLISH_URL || format('https://github.com/{0}/AFMKitMLX.git', github.repository_owner) }}
        run: >-
          Scripts/publish-provider-mirrors.sh
          "$RUNNER_TEMP/provider-mirrors"
          "${{ needs.qualify.outputs.tag }}"
          "${{ needs.qualify.outputs.qualified_sha }}"
      - name: Publish root tag and GitHub release last
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          QUALIFIED_SHA: ${{ needs.qualify.outputs.qualified_sha }}
          TAG_NAME: ${{ needs.qualify.outputs.tag }}
        with:
          script: |
            const publication = require(process.env.GITHUB_WORKSPACE + "/Scripts/release-publication.js");
            const result = await publication.publishRelease({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              tagName: process.env.TAG_NAME,
              qualifiedSha: process.env.QUALIFIED_SHA,
              defaultBranch: context.payload.repository.default_branch,
            });
            core.info(JSON.stringify(result));
