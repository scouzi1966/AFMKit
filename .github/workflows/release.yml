name: Qualify and publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create after qualification (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: afmkit-release
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify untagged commit
    runs-on: ${{ vars.AFMKIT_XCODE_RUNNER || 'xcode-27' }}
    outputs:
      qualified_sha: ${{ steps.qualified.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Validate requested tag
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a semantic version beginning with v."
            exit 1
          fi
      - name: Reject an existing tag
        uses: actions/github-script@v8
        env:
          TAG_NAME: ${{ inputs.tag }}
        with:
          script: |
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${process.env.TAG_NAME}`,
              });
              core.setFailed(`Tag ${process.env.TAG_NAME} already exists.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
      - name: Run full release qualification
        env:
          AFMKIT_DEPENDENCY_TOKEN: ${{ secrets.AFMKIT_DEPENDENCY_TOKEN }}
        run: Scripts/with-private-dependency-auth.sh Scripts/validate-release.sh
      - name: Record qualified commit
        id: qualified
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Create tag and GitHub release
    needs: qualify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish exact qualified commit
        uses: actions/github-script@v8
        env:
          QUALIFIED_SHA: ${{ needs.qualify.outputs.qualified_sha }}
          TAG_NAME: ${{ inputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tagName = process.env.TAG_NAME;
            const qualifiedSha = process.env.QUALIFIED_SHA;
            if (!/^[0-9a-f]{40}$/.test(qualifiedSha)) {
              throw new Error(`Invalid qualified commit SHA: ${qualifiedSha}`);
            }

            const tag = await github.rest.git.createTag({
              owner,
              repo,
              tag: tagName,
              message: `AFMKit ${tagName}`,
              object: qualifiedSha,
              type: "commit",
            });
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tagName}`,
              sha: tag.data.sha,
            });
            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tagName,
              target_commitish: qualifiedSha,
              name: `AFMKit ${tagName}`,
              generate_release_notes: true,
              draft: false,
            });
