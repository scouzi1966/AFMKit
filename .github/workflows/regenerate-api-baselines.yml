name: Regenerate API baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate normalized public symbol snapshots
    runs-on: ${{ vars.AFMKIT_XCODE27_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive
      - name: Record qualified hosted toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-build-version
          swift --version
      - name: Regenerate all public symbol snapshots
        env:
          AFMKIT_BUILD_ROOT: ${{ runner.temp }}/afmkit-baselines
          AFMKIT_API_BASELINE_ROOT: ${{ runner.temp }}/comparison-baselines
          REGENERATED_ROOT: ${{ runner.temp }}/regenerated-baselines
        run: |
          set -euo pipefail
          mkdir -p "$AFMKIT_API_BASELINE_ROOT" "$REGENERATED_ROOT"
          cp docs/api-baselines/*.symbols.json "$AFMKIT_API_BASELINE_ROOT/"
          differences=0
          while IFS= read -r module; do
            echo "::group::$module"
            if ! Scripts/check-afmkit-core-api.sh "$module"; then
              differences=$((differences + 1))
            fi
            test -f "$AFMKIT_BUILD_ROOT/api-current/$module.symbols.json"
            cp "$AFMKIT_BUILD_ROOT/api-current/$module.symbols.json" \
              "$REGENERATED_ROOT/$module.symbols.json"
            echo "::endgroup::"
          done < <(Scripts/check-api-baseline-coverage.sh --list)
          expected="$(Scripts/check-api-baseline-coverage.sh --list | wc -l | tr -d ' ')"
          actual="$(find "$REGENERATED_ROOT" -maxdepth 1 -name '*.symbols.json' | wc -l | tr -d ' ')"
          test "$actual" -eq "$expected"
          echo "API_BASELINE_DIFFERENCES=$differences" >> "$GITHUB_ENV"
      - name: Preserve normalized snapshot differences
        if: ${{ env.API_BASELINE_DIFFERENCES != '0' }}
        env:
          REGENERATED_ROOT: ${{ runner.temp }}/regenerated-baselines
        run: |
          for snapshot in "$REGENERATED_ROOT"/*.symbols.json; do
            name="$(basename "$snapshot")"
            diff -u "docs/api-baselines/$name" "$snapshot" || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regenerated-api-baselines-${{ github.run_id }}
          path: ${{ runner.temp }}/regenerated-baselines/*.symbols.json
          if-no-files-found: error
          retention-days: 7
      - name: Fail when hosted snapshots differ
        if: ${{ env.API_BASELINE_DIFFERENCES != '0' }}
        run: |
          echo "Hosted toolchain produced $API_BASELINE_DIFFERENCES changed API snapshots."
          exit 1
