name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-gates:
    name: Token-independent gates
    runs-on: ${{ vars.AFMKIT_XCODE_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
      - name: Verify qualified Xcode and Swift
        run: Scripts/verify-qualified-toolchain.sh
      - name: Check public module baseline coverage
        run: Scripts/check-api-baseline-coverage.sh
      - name: Test API gate failure modes
        run: Scripts/test-api-gate.sh
      - name: Test private dependency auth cleanup
        run: Scripts/test-private-dependency-auth.sh
      - name: Test release qualification guards
        run: Scripts/test-release-qualification.sh
      - name: Check script syntax and whitespace
        run: |
          bash -n Scripts/*.sh
          python3 -m py_compile Scripts/public-library-modules.py
          git diff --check

  api-baselines:
    name: API baselines (private graph)
    needs: public-gates
    runs-on: ${{ vars.AFMKIT_XCODE_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
      - name: Check all public API baselines
        env:
          AFMKIT_DEPENDENCY_TOKEN: ${{ secrets.AFMKIT_DEPENDENCY_TOKEN }}
        run: Scripts/with-private-dependency-auth.sh Scripts/check-api-baselines.sh

  package-tests:
    name: Debug package tests (private graph)
    needs: public-gates
    runs-on: ${{ vars.AFMKIT_XCODE_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
      - name: Verify qualified Xcode and Swift
        run: Scripts/verify-qualified-toolchain.sh
      - name: Run pinned Debug package tests
        env:
          AFMKIT_DEPENDENCY_TOKEN: ${{ secrets.AFMKIT_DEPENDENCY_TOKEN }}
        run: |
          Scripts/with-private-dependency-auth.sh \
            /usr/bin/xcrun --toolchain XcodeDefault swift test \
              --build-system native \
              --disable-automatic-resolution \
              --disable-swift-testing
