name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-baselines:
    name: API baselines (clean Xcode 27 Beta 3)
    runs-on: ${{ vars.AFMKIT_XCODE_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure private dependency access
        env:
          AFMKIT_DEPENDENCY_TOKEN: ${{ secrets.AFMKIT_DEPENDENCY_TOKEN }}
        run: |
          if [[ -z "$AFMKIT_DEPENDENCY_TOKEN" ]]; then
            echo "::error::Set AFMKIT_DEPENDENCY_TOKEN to a token with read access to the private AFM-compatible MLX repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${AFMKIT_DEPENDENCY_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Test API gate failure modes
        run: Scripts/test-api-gate.sh
      - name: Check Foundation Models MLX API from a clean build
        run: Scripts/check-afmkit-core-api.sh AFMKitFoundationModelsMLX
      - name: Check merge-gating API baselines
        run: Scripts/check-api-baselines.sh

  package-tests:
    name: Package tests
    runs-on: ${{ vars.AFMKIT_XCODE_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure private dependency access
        env:
          AFMKIT_DEPENDENCY_TOKEN: ${{ secrets.AFMKIT_DEPENDENCY_TOKEN }}
        run: |
          if [[ -z "$AFMKIT_DEPENDENCY_TOKEN" ]]; then
            echo "::error::Set AFMKIT_DEPENDENCY_TOKEN to a token with read access to the private AFM-compatible MLX repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${AFMKIT_DEPENDENCY_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: swift test --disable-swift-testing

  release-validation:
    name: Release validation
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.AFMKIT_XCODE_RUNNER || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure private dependency access
        env:
          AFMKIT_DEPENDENCY_TOKEN: ${{ secrets.AFMKIT_DEPENDENCY_TOKEN }}
        run: |
          if [[ -z "$AFMKIT_DEPENDENCY_TOKEN" ]]; then
            echo "::error::Set AFMKIT_DEPENDENCY_TOKEN to a token with read access to the private AFM-compatible MLX repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${AFMKIT_DEPENDENCY_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: Scripts/validate-release.sh
