name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-baselines:
    name: API baselines (clean Xcode 27 Beta 3)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test API gate failure modes
        run: Scripts/test-api-gate.sh
      - name: Check Foundation Models MLX API from a clean build
        run: Scripts/check-afmkit-core-api.sh AFMKitFoundationModelsMLX
      - name: Check merge-gating API baselines
        run: Scripts/check-api-baselines.sh

  package-tests:
    name: Package tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: swift test --disable-swift-testing

  release-validation:
    name: Release validation
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: Scripts/validate-release.sh
